<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#fff7e8"/><meta name="description" content="搬搬家具、挑挑顏色，佈置一個自己的小天地。"/><title>我的小房間 · 小小遊樂園</title><link rel="stylesheet" href="../play.css?v=10"/></head><body><main class="play-shell"><nav class="navigation" aria-label="遊戲導覽"><a href="../../index.html">← 回遊樂園</a><span>動動小手 · 一起玩</span></nav><header><p class="eyebrow">A LITTLE PLACE FOR YOU</p><h1>我的小房間</h1><p class="intro">搬搬家具、挑挑顏色，佈置一個自己的小天地。</p></header><div class="play-layout"><section class="stage-card" aria-label="遊戲區"><div class="stage-header"><span>我的房間</span><span id="stageLabel"></span></div><div class="scene" id="scene"></div><div class="stage-actions"><button class="action neutral" id="example" type="button">範例佈置</button><button class="action neutral" id="clear" type="button">清空家具</button><button class="action pink" id="download" type="button">↓ 存成圖片</button></div><p class="hint" id="hint" role="status"></p></section><section class="tool-panel" aria-label="工具箱"><div class="tabs" id="roomTabs" aria-label="選擇佈置項目"><button class="tab selected" type="button" data-tab="furniture" aria-pressed="true">家具</button><button class="tab" type="button" data-tab="wall" aria-pressed="false">牆壁</button><button class="tab" type="button" data-tab="floor" aria-pressed="false">地板</button></div><div id="furniturePanel"><div class="panel-title"><h2>家具小倉庫</h2><span>拖進房間裡</span></div><div class="tile-grid" id="furniture"></div><div class="selection-tools"><button class="action neutral" id="variant" type="button" disabled>換個樣子</button><button class="action neutral" id="remove" type="button" disabled>移走家具</button></div></div><div class="panel-title"><h3 id="colorTitle">家具顏色</h3><span id="selectionName">先選一件家具</span></div><div class="swatches" id="colors"></div><label class="custom">自選顏色<input type="color" id="customColor" value="#e4ae83" aria-label="自選顏色" /></label><p class="small-note">家具放好後，可以再拖曳移動、換款式與顏色。佈置會自動保留在這個瀏覽器。</p></section></div><footer>舒服的小角落，由你來決定。</footer></main><script src="../play.js?v=10"></script><script src="game.js?v=10"></script></body></html>
