<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三車道小車手 · 小小遊樂園</title><link rel="stylesheet" href="../play.css"><link rel="stylesheet" href="traffic.css?v=21"></head><body><main class="drive-shell"><nav class="navigation"><a href="../../index.html">← 小小遊樂園</a><span>THREE LANE DRIVE</span></nav><header><p class="eyebrow">閃躲挑戰</p><h1>三車道小車手</h1></header><section class="game"><div class="dashboard"><div>這次撐了<strong id="time">0.0 <small>秒</small></strong></div><div>本次分頁最高<strong id="best">0.0 <small>秒</small></strong></div><button id="pause" class="pause" disabled aria-label="暫停遊戲">暫停</button></div><div class="road-wrap"><canvas id="road" width="420" height="600" aria-label="三車道公路，使用左右方向鍵或下方按鈕換道"></canvas><div id="overlay" class="overlay"><div class="message"><span class="tag" id="tag">準備出發</span><h2 id="title">你能撐幾秒？</h2><p id="message">左右換道，避開前面的車子。<br>撞車就結束，再試一次挑戰紀錄！</p><button id="start" class="start">開始出發 →</button></div></div></div><div class="controls"><button id="left" aria-label="往左換一車道">← 左移</button><p>左右鍵 / A、D<br>也可以在道路上滑動</p><button id="right" aria-label="往右換一車道">右移 →</button></div></section><footer>最高紀錄保留在這個分頁的 session，重新整理也還在。</footer></main><script src="game.js?v=21"></script></body></html>
