<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#fff7e8"/><meta name="description" content="洗掉髒污，吹乾毛毛，照顧可愛的小客人。"/><title>寵物洗澡店 · 小小遊樂園</title><link rel="stylesheet" href="../play.css?v=10"/><link rel="stylesheet" href="pets.css?v=18"/></head><body><main class="play-shell"><nav class="navigation" aria-label="遊戲導覽"><a href="../../index.html">← 回遊樂園</a><span>動動小手 · 一起玩</span></nav><header><p class="eyebrow">BUBBLES AND CUDDLES</p><h1>寵物洗澡店</h1><p class="intro">洗掉髒污，吹乾毛毛，照顧可愛的小客人。</p></header><div class="play-layout"><section class="stage-card" aria-label="遊戲區"><div class="stage-header"><span>今天的小客人</span><span id="stageLabel"></span></div><div class="scene" id="scene"></div><div class="stage-actions"><button class="action pink" id="finishDress" type="button" hidden>打扮好了！</button><button class="action neutral" id="restart" type="button">再洗一次</button></div><p class="hint" id="hint" role="status"></p></section><section class="tool-panel" aria-label="工具箱"><div class="tabs" id="petTabs" aria-label="選擇寵物"></div><div class="steps" id="steps" aria-label="洗澡步驟"></div><div class="panel-title"><h2 id="toolTitle">洗澡小工具</h2><span>拖到毛毛上</span></div><div class="tile-grid" id="tools"></div><div class="meter" role="progressbar" aria-label="洗澡進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="meter-fill" id="progressFill"></div></div><p class="small-note">先搓洗，再沖水、吹乾，最後自由搭配頭飾、眼鏡和領巾，再按「打扮好了」。要來回拖曳，才能把毛毛照顧乾淨喔！</p></section></div><footer>溫柔一點，小動物會很開心。</footer></main><dialog class="celebration" id="celebration"><div class="reward" aria-hidden="true">✨</div><h2>香香乾淨，洗好囉！</h2><p id="thanks">謝謝你的照顧！</p><button class="action pink" id="nextPet" type="button">下一位小客人</button></dialog><script src="../play.js?v=10"></script><script src="animal-library.js?v=18"></script><script src="game.js?v=18"></script></body></html>
