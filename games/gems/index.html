<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>彩虹寶石收集 · 小小遊樂園</title><link rel="stylesheet" href="../play.css"><link rel="stylesheet" href="../traffic/traffic.css?v=21"><link rel="stylesheet" href="gems.css?v=23"></head><body><main class="drive-shell"><nav class="navigation"><a href="../../index.html">← 小小遊樂園</a><span>RAINBOW GEM RUN</span></nav><header><p class="eyebrow">收集挑戰</p><h1>彩虹寶石收集</h1></header><section class="game"><div class="dashboard"><div>這次收集<strong id="time">0 <small>顆</small></strong></div><div>本次分頁最高<strong id="best">0 <small>顆</small></strong></div><button id="pause" class="pause" disabled aria-label="暫停遊戲">暫停</button></div><div class="road-wrap"><canvas id="road" width="420" height="600" aria-label="水晶森林，控制跑步角色，使用左右方向鍵或下方按鈕換道"></canvas><div id="overlay" class="overlay"><div class="message"><span class="tag" id="tag">準備出發</span><h2 id="title">收集彩虹寶石！</h2><p id="message">在水晶森林裡跑步，接住彩色寶石。<br>每局 60 秒，漏接也可以繼續玩！</p><button id="start" class="start">開始出發 →</button></div></div></div><div class="gem-status"><span id="remaining">剩下 60 秒</span><span id="collected" role="status">準備接住寶石！</span></div><div class="controls"><button id="left" aria-label="往左換一車道">← 左移</button><p>左右鍵 / A、D<br>也可以在畫面上滑動</p><button id="right" aria-label="往右換一車道">右移 →</button></div></section><footer>最高紀錄保留在這個分頁的 session，重新整理也還在。</footer></main><script src="game.js?v=23"></script></body></html>
