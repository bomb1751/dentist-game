<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小小看診室 · 小小遊樂園</title><link rel="stylesheet" href="../play.css"><link rel="stylesheet" href="doctor.css?v=19"></head>
<body class="doctor-game"><main class="play-shell"><nav class="navigation"><a href="../../index.html">← 小小遊樂園</a><span>溫柔照顧每一位小病人</span></nav><header><p class="eyebrow">LITTLE DOCTOR</p><h1>小小看診室</h1><p class="intro">拖曳工具檢查身體，再陪病人完成照顧。</p></header><div class="play-layout"><section class="stage-card"><div class="stage-header"><strong id="patientName"></strong><span id="counter"></span></div><div id="scene" class="scene"></div><div class="meter" aria-label="目前步驟進度"><div id="progress" class="meter-fill"></div></div><p id="hint" class="hint" role="status"></p><div class="stage-actions"><button class="action neutral" id="restart">重新看診</button><button class="action pink" id="next">換位病人</button></div></section><section class="tool-panel"><div class="tabs" id="cases" aria-label="看診情境"></div><div class="symptom"><span>今天怎麼了？</span><strong id="symptom"></strong></div><div class="steps" id="steps"></div><div class="panel-title"><h2 id="taskTitle"></h2><span>拖曳操作</span></div><div class="tile-grid" id="tools"></div><p class="small-note">這是扮演醫生的遊戲。真實不舒服時，請告訴大人，由醫師檢查與決定照顧方式。</p><div id="result" class="result" hidden><strong>看診完成！</strong><p>謝謝你溫柔照顧我，回家也要好好休息。</p><button class="action" id="again">照顧下一位 →</button></div></section></div></main><script src="../play.js"></script><script src="game.js?v=19"></script></body></html>
